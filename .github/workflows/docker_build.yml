name: Docker Build

# The heavy tier. Fast contract tests gate every PR in pr-checks.yml; this one
# builds the full image and exercises it, which takes ~30 minutes, so it runs on
# a schedule, on demand, and on release tags rather than on every push.

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      # Keeps main verified, and keeps the type=gha layer cache warm so the
      # PR container leg restores rather than rebuilds.
      - main
    tags:
      - 'v*'
  pull_request:
    # Only for changes that can plausibly break container packaging. Apptainer
    # breakage comes from the image, the definition or the entrypoint -- not from
    # benchmark code -- so everything else stays on the nightly signal.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.python-version'
      - '*/.python-version'
      - 'container.sdef'
      - 'entrypoint.py'
      - 'docker/**'
      - '.github/workflows/docker_build.yml'

# One image build at a time per ref. This job is ~15 minutes and can be started
# from four different triggers at once (a push, the matching pull_request, a
# schedule and a manual dispatch), which leaves several multi-GB builds fighting
# for runners. cancel-in-progress is deliberately false: killing a build that is
# most of the way through wastes more than it saves, so later runs queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TEST_TAG: bencher:ci

jobs:
  build-and-test:
    # Docker and Apptainer share one job so the image is built once and both
    # runtimes exercise the same bytes. They used to be separate jobs, and the
    # Apptainer one rebuilt from a registry image rather than the code under
    # test.
    runs-on: ubuntu-24.04
    steps:
      - run: df -h

      - name: Free runner disk
        # The image is ~2.6 GB and Apptainer needs room for a sandbox too.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
      - run: df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The old CACHEBUST build-arg was inert: the Dockerfile never declared
          # `ARG CACHEBUST`, so it busted nothing and only emitted a warning.

      - name: Start the container
        run: docker run -d --name bencher -p 50051:50051 ${{ env.TEST_TAG }}

      - name: Verify Docker managed Python interpreters
        run: docker exec -i bencher sh < .github/scripts/verify_uv_venvs.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install the e2e client
        # The root project: bencherscaffold + pytest, nothing else. The e2e
        # assertions live in this repo now, so they version with the services
        # they test rather than in a separately checked-out client repo.
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PYTHON_DOWNLOADS: never
        run: |
          version="$(cat .python-version)"
          uv sync --python "$version" --group dev

      - name: Wait for the front door
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PYTHON_DOWNLOADS: never
        run: |
          for _ in $(seq 1 60); do
            if uv run python -c "
          import grpc, sys
          try:
              grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=3)
          except Exception:
              sys.exit(1)"; then exit 0; fi
            sleep 5
          done
          echo "front door never came up"; docker logs bencher | tail -50; exit 1

      - name: Run e2e against the Docker container
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PYTHON_DOWNLOADS: never
        run: uv run pytest tests/e2e -q --target localhost:50051

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker exec bencher sh -c 'for f in /root/*_bencher.err; do
            [ -s "$f" ] && { echo "=== $f"; tail -40 "$f"; }
          done' || true

      - name: Stop the Docker container
        # Unconditional: a failed e2e run would otherwise leave the container
        # holding port 50051, and the Apptainer instance below would fail to
        # bind -- replacing the real failure with a confusing port conflict.
        if: always()
        run: docker rm -f bencher || true

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.0

      - name: Build the Apptainer image from the image just built
        # container.sdef pins a published base image, which is right for users
        # but wrong here: CI must test the build from this commit, not whatever
        # the registry currently holds. Point a throwaway copy at the image we
        # just built instead of editing the committed definition.
        #
        # Via a docker-archive tarball rather than `Bootstrap: docker-daemon`.
        # The daemon route streams the image out through the Docker API and
        # repeatedly killed the runner ~75s into "Fetching OCI image..." with no
        # Apptainer-level error. `docker save` is a plain file read, which is
        # predictable, resumable and easy to inspect when it goes wrong.
        run: |
          set -euo pipefail
          echo "--- resources before ---"; free -h; df -h /
          docker save "${TEST_TAG}" -o bencher-image.tar
          ls -lh bencher-image.tar

          sed -e "s|^Bootstrap: .*|Bootstrap: docker-archive|" \
              -e "s|^From: .*|From: bencher-image.tar|" container.sdef > ci.sdef
          echo "--- ci.sdef header ---"; head -4 ci.sdef

          # A real .sif, deliberately NOT --sandbox. A sandbox is a writable
          # directory owned by the invoking user, so it reproduces none of the
          # read-only-filesystem failures that are the whole reason to test
          # Apptainer separately -- and the README tells users to build a .sif.
          # Apptainer does not create its tmpdir, and staging is substantial: the
          # uncompressed tarball is ~7.3 GB against a 2.6 GB image, on a runner
          # with 15 GB of RAM. Pointing it at disk rather than letting it default
          # is very likely what the earlier silent runner kills were about.
          mkdir -p "$RUNNER_TEMP/apptainer"
          APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer" \
            apptainer build bencher.sif ci.sdef
          ls -lh bencher.sif
          rm -f bencher-image.tar
          echo "--- resources after ---"; free -h; df -h /

      - name: Verify Apptainer managed Python interpreters
        run: apptainer exec bencher.sif sh < .github/scripts/verify_uv_venvs.sh

      - name: Start the Apptainer instance
        run: |
          # BO4Mob writes results to a *relative* `output/` path, and
          # entrypoint.py runs each service with cwd=/opt/bencher/<Package>, so
          # the directory it actually uses is /opt/bencher/BO4MobBenchmark/output.
          # The previous bind pointed at .../src/bo4mobbenchmark/output, a path
          # the code never touches -- harmless under a writable sandbox, fatal on
          # a real read-only .sif.
          mkdir -p output
          apptainer instance start \
            --bind "$(pwd)/output:/opt/bencher/BO4MobBenchmark/output" \
            bencher.sif bencher

      - name: Wait for the Apptainer front door
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PYTHON_DOWNLOADS: never
        run: |
          for _ in $(seq 1 60); do
            if uv run python -c "
          import grpc, sys
          try:
              grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=3)
          except Exception:
              sys.exit(1)"; then exit 0; fi
            sleep 5
          done
          echo "Apptainer front door never came up"; exit 1

      - name: Apptainer runs rootless
        # Docker runs as uid 0 with a writable overlay; Apptainer runs as the
        # invoking user against a read-only image. Anything the build left
        # unreadable fails here and nowhere else, which is what the Dockerfile's
        # per-stage `chmod -R a+rX` exists for.
        run: |
          uid=$(apptainer exec bencher.sif id -u)
          echo "uid inside the container: $uid"
          [ "$uid" != "0" ] || { echo "::error::expected a non-root uid"; exit 1; }

      - name: The image root really is read-only
        # Guards the premise of every check below. If this ever passes, the tier
        # has silently gone back to testing a writable sandbox and none of the
        # read-only failure modes are being exercised.
        run: |
          if apptainer exec bencher.sif sh -c 'touch /opt/bencher/.writetest' 2>/dev/null; then
            echo "::error::/opt/bencher is writable -- is this a --sandbox build?"
            exit 1
          fi
          echo "confirmed read-only"

      - name: Service logs land in \$HOME, not the image
        # entrypoint.py writes per-service logs to $HOME, which under Apptainer is
        # the *host* user's home rather than /root in the image.
        run: |
          ls -la "$HOME"/*_bencher.out >/dev/null || {
            echo "::error::no per-service logs in \$HOME"; exit 1; }
          echo "found $(ls "$HOME"/*_bencher.out | wc -l) service logs in \$HOME"

      - name: Run e2e against the Apptainer instance
        # Previously this ran `apptainer run instance://bencher`, but the
        # instance had been started as `bencherclient` -- the names did not
        # match, so this step could never have worked.
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PYTHON_DOWNLOADS: never
        run: uv run pytest tests/e2e -q --target localhost:50051

      - name: BO4Mob wrote into the bound directory
        # The one place a service writes inside the image tree. If the bind is
        # wrong the e2e above already failed; this says so directly.
        run: |
          find output -maxdepth 4 | head -20
          [ -n "$(ls -A output 2>/dev/null)" ] || \
            echo "::warning::bound output/ is empty -- did a BO4Mob benchmark run?"

      - name: APPTAINERENV_ port overrides work
        # Documented in README.md as the way to move ports on HPC, and untested
        # until now. Uses a second instance on a different port.
        env:
          UV_MANAGED_PYTHON: "1"
          UV_PYTHON_DOWNLOADS: never
        run: |
          apptainer instance stop bencher || true
          APPTAINERENV_BENCHER_SERVER_PORT=60051 \
            apptainer instance start bencher.sif bencher-alt
          for _ in $(seq 1 60); do
            if uv run python -c "
          import grpc, sys
          try:
              grpc.channel_ready_future(grpc.insecure_channel('localhost:60051')).result(timeout=3)
          except Exception:
              sys.exit(1)"; then
              echo "front door answered on the overridden port 60051"; exit 0
            fi
            sleep 5
          done
          echo "::error::BENCHER_SERVER_PORT override did not take effect"
          tail -40 "$HOME"/BencherServer_bencher.err 2>/dev/null || true
          exit 1

      - name: Dump Apptainer service logs on failure
        if: failure()
        # Without this an Apptainer failure produces no diagnostics at all: the
        # logs are in the runner's $HOME, not in any container.
        run: |
          for f in "$HOME"/*_bencher.err; do
            [ -s "$f" ] && { echo "=== $f"; tail -40 "$f"; }
          done || true

      - name: Stop the Apptainer instances
        if: always()
        run: |
          apptainer instance stop bencher || true
          apptainer instance stop bencher-alt || true
